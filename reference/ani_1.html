<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>honemik → 蜂蜜牛奶</title>

  <style>
    :root {
      --bg: #f7f2e8;
      --text: #2b251f;
      --soft: #b9a98f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family:
        "Noto Serif TC",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Songti TC",
        serif;
    }

    .scene {
      text-align: center;
      padding: 56px 28px;
    }

    .caption {
      margin-bottom: 22px;
      font-size: 12px;
      letter-spacing: .28em;
      color: var(--soft);
    }

    .brand {
      position: relative;
      width: min(86vw, 620px);
      height: clamp(78px, 13vw, 132px);
      overflow: hidden;
    }

    .word {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      white-space: nowrap;
      font-weight: 400;
      color: var(--text);
      will-change: clip-path, opacity, transform, filter;
    }

    .word-en {
      font-size: clamp(42px, 8.5vw, 96px);
      letter-spacing: .18em;
      font-family:
        "Cormorant Garamond",
        "Times New Roman",
        serif;
      animation: paper-out 4.8s cubic-bezier(.22, 1, .36, 1) infinite;
    }

    .word-zh {
      opacity: 0;
      font-size: clamp(44px, 8vw, 92px);
      letter-spacing: .12em;
      clip-path: inset(0 100% 0 0);
      animation: ink-in 4.8s cubic-bezier(.22, 1, .36, 1) infinite;
    }

    .brand::after {
      content: "";
      position: absolute;
      top: 14%;
      bottom: 14%;
      width: 1px;
      left: -8%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(43, 37, 31, .34),
        transparent
      );
      opacity: 0;
      animation: brush-line 4.8s cubic-bezier(.22, 1, .36, 1) infinite;
    }

    @keyframes paper-out {
      0%, 30% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
        clip-path: inset(0 0 0 0);
      }

      48% {
        opacity: .18;
        transform: translateX(10px);
        filter: blur(2px);
        clip-path: inset(0 0 0 100%);
      }

      49%, 100% {
        opacity: 0;
        transform: translateX(10px);
        filter: blur(2px);
        clip-path: inset(0 0 0 100%);
      }
    }

    @keyframes ink-in {
      0%, 42% {
        opacity: 0;
        transform: translateX(-8px);
        filter: blur(1px);
        clip-path: inset(0 100% 0 0);
      }

      58%, 100% {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes brush-line {
      0%, 30% {
        left: -8%;
        opacity: 0;
      }

      36% {
        opacity: 1;
      }

      58% {
        left: 108%;
        opacity: 1;
      }

      66%, 100% {
        left: 108%;
        opacity: 0;
      }
    }

    .note {
      margin-top: 24px;
      font-size: 14px;
      letter-spacing: .1em;
      color: var(--soft);
    }

    @media (prefers-reduced-motion: reduce) {
      .word-en,
      .word-zh,
      .brand::after {
        animation: none;
      }

      .word-en {
        opacity: 0;
      }

      .word-zh {
        opacity: 1;
        clip-path: inset(0 0 0 0);
        transform: none;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="caption">quiet milk & honey</div>

    <div class="brand" aria-label="honemik 轉換為蜂蜜牛奶">
      <span class="word word-en">honemik</span>
      <span class="word word-zh">蜂蜜牛奶</span>
    </div>

    <p class="note">像紙面被細線輕輕刷過，文字安靜顯影。</p>
  </main>
</body>
</html>
